<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d100f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recomp">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Recomp</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
<style>
/* =========================================================================
   THEME
   ========================================================================= */
:root{
  --bg:#f4f5f3; --card:#ffffff; --card2:#eceeea; --ink:#141816; --ink2:#59615c; --ink3:#8d958f; --line:#e1e4df;
  --accent:#1e9a52; --accent-soft:rgba(30,154,82,.15); --amber:#c4860c; --amber-soft:rgba(196,134,12,.15);
  --red:#cf4338; --red-soft:rgba(207,67,56,.12); --neutral:#a3aba6;
  --radius:16px; --tab-h:58px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --bg:#0d100f; --card:#161a18; --card2:#212622; --ink:#eef1ee; --ink2:#a4ada7; --ink3:#6f7872; --line:#272d29;
    --accent:#34c06d; --accent-soft:rgba(52,192,109,.16); --amber:#e3a52b; --amber-soft:rgba(227,165,43,.16);
    --red:#ef6a5f; --red-soft:rgba(239,106,95,.14); --neutral:#59625c; color-scheme:dark;
  }
}
:root[data-theme=dark]{
  --bg:#0d100f; --card:#161a18; --card2:#212622; --ink:#eef1ee; --ink2:#a4ada7; --ink3:#6f7872; --line:#272d29;
  --accent:#34c06d; --accent-soft:rgba(52,192,109,.16); --amber:#e3a52b; --amber-soft:rgba(227,165,43,.16);
  --red:#ef6a5f; --red-soft:rgba(239,106,95,.14); --neutral:#59625c; color-scheme:dark;
}

/* =========================================================================
   BASE + LAYOUT
   ========================================================================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
html.noscroll,html.noscroll body{overflow:hidden}
body{font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35;cursor:default}
input,select,textarea{font-size:16px}
h1,h2,h3,h4,p{margin:0}
.num{font-variant-numeric:tabular-nums}
#view{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 12px) 14px calc(var(--tab-h) + var(--safe-b) + 96px)}
.top{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.top h1{font-size:26px;letter-spacing:-.02em;line-height:1.15}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.center{text-align:center;justify-content:center}
.right{text-align:right}
.mt{margin-top:12px}.mt-s{margin-top:6px}.mb{margin-bottom:12px}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}
.small{font-size:13px}.tiny{font-size:11.5px}
.sub{color:var(--ink2);font-size:13px}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.title{font-weight:650;font-size:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ok{color:var(--accent)}.warn{color:var(--amber)}.bad{color:var(--red)}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:0 0 10px;font-weight:650;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 .num{text-transform:none;letter-spacing:0;font-weight:600}
.card h4{font-size:14px;margin:14px 0 8px}
.card.accent{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.card.amber{border-color:var(--amber)}
.banner{border-radius:14px;padding:12px 14px;background:var(--amber-soft);margin-bottom:12px;font-size:14px}
.banner.green{background:var(--accent-soft)}
.empty{color:var(--ink2);font-size:14px;padding:6px 0}

/* Buttons */
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.block{width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:0 8px}
.btn.danger{color:var(--red)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.icon-btn{width:44px;height:44px;flex:0 0 44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-grid;place-items:center;font-size:20px;font-weight:600;padding:0;line-height:1}
.icon-btn.lg{width:56px;height:56px;flex-basis:56px;font-size:26px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:14px;font-weight:550}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.soft{background:var(--card2);border-color:transparent}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:14px;padding:0 6px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);color:var(--accent)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.grey{background:var(--card2);color:var(--ink2)}

/* Forms */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.field label,.lbl{font-size:12.5px;color:var(--ink2)}
.input{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;width:100%;min-width:0}
textarea.input{padding:10px 12px;min-height:76px;resize:vertical;line-height:1.4}
select.input{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.ns{display:flex;align-items:center;gap:10px}
.ns .input{text-align:center;font-weight:700}
.ns .input.big{font-size:30px;min-height:56px}
.ns.sm .input{min-height:44px;width:72px;flex:0 0 72px}

/* Bars & rings */
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.mrow{margin-top:10px}
.mrow .row{font-size:13.5px;margin-bottom:4px}
.rings{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;align-items:center}
.ringbox{position:relative;display:grid;place-items:center}
.ringbox svg{display:block;width:100%;height:auto}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.1}
.ringtxt .big{font-size:40px;font-weight:750;letter-spacing:-.03em}
.ringtxt .mid{font-size:28px;font-weight:750;letter-spacing:-.02em}

/* Today tiles */
.tile{background:var(--card2);border-radius:14px;padding:10px;min-height:76px;display:flex;flex-direction:column;justify-content:space-between;border:0;text-align:left;width:100%;min-width:0}
.tile .val{font-size:21px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.tile .val small{font-size:12px;color:var(--ink2);font-weight:500}
.val{font-size:21px;font-weight:700}
.val small{font-size:12px;color:var(--ink2);font-weight:500}
.supp{display:flex;align-items:center;gap:10px;min-height:48px;width:100%;border:0;background:none;padding:2px 0;text-align:left;border-top:1px solid var(--line)}
.supp:first-of-type{border-top:0}
.box{width:28px;height:28px;flex:0 0 28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
.box.on{background:var(--accent);border-color:var(--accent)}
.stats .val{font-size:22px}

/* Lists */
.li{display:flex;align-items:center;gap:10px;min-height:50px;padding:6px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.li:first-child{border-top:0}
.list>.li:first-child{border-top:0}

/* Train */
.hint{display:inline-block;margin:8px 0 4px;padding:4px 10px;border-radius:8px;background:var(--card2);font-size:13.5px;font-weight:600}
.hint.up{background:var(--accent-soft);color:var(--accent)}
.setrow{display:grid;grid-template-columns:24px minmax(60px,1fr) 44px 52px 44px 50px;gap:6px;align-items:center;margin-top:6px}
.setrow.head{margin-top:8px;font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.setrow.head span{text-align:center}
.setrow input{height:44px;text-align:center;border-radius:10px;border:1px solid var(--line);background:var(--bg);width:100%;min-width:0;font-weight:650;font-size:17px;font-variant-numeric:tabular-nums;padding:0 4px}
.setrow.done input{background:var(--accent-soft);border-color:transparent}
.setn{font-weight:700;color:var(--ink3);text-align:center}
.tick{position:relative;width:50px;height:44px;border-radius:12px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;font-size:18px;font-weight:800;color:var(--ink3)}
.tick.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tick.pr::after{content:'PR';position:absolute;top:-8px;right:-6px;background:var(--ink);color:var(--bg);font-size:9.5px;font-weight:800;padding:2px 5px;border-radius:6px}
.hist-set{display:grid;grid-template-columns:20px 1fr auto 1fr auto 40px;gap:6px;align-items:center;margin-top:6px;font-size:14px}
.hist-set input{height:40px;text-align:center;border-radius:9px;border:1px solid var(--line);background:var(--bg);width:100%;min-width:0}

/* Rest timer bar */
.restbar{position:fixed;left:10px;right:10px;bottom:calc(var(--tab-h) + var(--safe-b) + 8px);max-width:540px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;display:none;align-items:center;gap:6px;z-index:25;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.restbar.show{display:flex}
.restbar.over{background:var(--accent);color:#fff}
.restbar button{min-height:44px;min-width:50px;border-radius:12px;border:0;background:rgba(127,127,127,.25);color:inherit;font-weight:700;padding:0 10px}
.restbar .prog{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);width:0}

/* Toast */
.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(var(--tab-h) + var(--safe-b) + 72px);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;z-index:60;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100vw - 24px);font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{min-height:36px;border:0;border-radius:10px;padding:0 12px;background:var(--accent);color:#fff;font-weight:700}

/* Bottom sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:none}
.sheet-wrap.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.42)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;overflow-y:auto;overflow-x:hidden;background:var(--card);border-radius:22px 22px 0 0;padding:6px 16px calc(20px + var(--safe-b));max-width:560px;margin:0 auto;animation:up .18s ease-out;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{position:sticky;top:-6px;background:var(--card);padding:6px 0 4px;z-index:2;display:flex;justify-content:flex-end;margin:0 -4px}
.sheet-head .grab{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:40px;height:5px;border-radius:9px;background:var(--line)}
.sheet h3{font-size:19px;margin:0 0 6px}
.pp{border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px}
.pp.miss{border-color:var(--amber);background:var(--amber-soft)}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}
@supports (backdrop-filter:blur(10px)) or (-webkit-backdrop-filter:blur(10px)){
  .tabs{background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--ink3);font-weight:650;padding:0}
.tabs button.on{color:var(--accent)}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Progress */
.chart{position:relative;height:210px;margin-top:8px}
.chart.sm{height:170px}
.kv{display:grid;grid-template-columns:1fr auto auto auto;gap:4px 12px;font-size:14px;align-items:center}
.kv .h{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.vol{display:grid;grid-template-columns:84px 1fr 34px;gap:8px;align-items:center;margin:6px 0;font-size:13.5px}
.vol .track{position:relative;height:16px;background:var(--card2);border-radius:6px;overflow:hidden}
.vol .zone{position:absolute;top:0;bottom:0;left:50%;width:30%;background:var(--accent-soft)}
.vol .fill{position:absolute;top:3px;bottom:3px;left:0;border-radius:4px;background:var(--accent)}
.heat{display:grid;gap:3px;align-items:center}
.heat .c{aspect-ratio:1;border-radius:3px;background:var(--card2)}
.heat .c.gym{background:var(--accent)}
.heat .c.cardio{background:color-mix(in srgb,var(--accent) 55%,var(--card2))}
.heat .c.log{background:var(--accent-soft)}
.heat .c.out{background:transparent;border:1px dashed var(--line)}
.heat .c.today{outline:2px solid var(--ink);outline-offset:1px}
.heat .l{font-size:10px;color:var(--ink3)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photos figure{margin:0}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--card2);display:block}
.photos figcaption{font-size:12px;color:var(--ink2);margin-top:4px}
.photo-slot{aspect-ratio:3/4;border-radius:12px;border:1.5px dashed var(--line);background:var(--card2);display:grid;place-items:center;font-size:13px;color:var(--ink2);padding:0;overflow:hidden;width:100%}
.photo-slot img{width:100%;height:100%;object-fit:cover}
table.simple{width:100%;border-collapse:collapse;font-size:13.5px}
table.simple td,table.simple th{padding:7px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.simple th{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;border-top:0}
pre.reason{white-space:pre-wrap;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--card2);border-radius:12px;padding:10px 12px;margin:8px 0 0;color:var(--ink2)}
</style>
</head>
<body>
<main id="view" aria-live="polite"></main>

<div id="restbar" class="restbar" role="timer">
  <div class="prog" id="restProg"></div>
  <div class="grow"><div class="tiny" style="opacity:.7">Rest</div><div id="restTime" class="num" style="font-size:26px;font-weight:800;line-height:1.1">0:00</div></div>
  <button data-a="rest-add" data-s="-15">−15</button>
  <button data-a="rest-add" data-s="30">+30</button>
  <button data-a="rest-stop">Skip</button>
</div>
<div id="toast" class="toast" role="status"></div>
<div id="sheet" class="sheet-wrap"><div class="backdrop" data-a="sheet-close"></div><div class="sheet" role="dialog" aria-modal="true"></div></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="photoFile" accept="image/*" hidden>

<nav class="tabs" id="tabs">
  <button data-a="tab" data-t="today"><svg viewBox="0 0 24 24"><path d="M3.5 10.5 12 4l8.5 6.5V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg>Today</button>
  <button data-a="tab" data-t="train"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Train</button>
  <button data-a="tab" data-t="eat"><svg viewBox="0 0 24 24"><path d="M3.5 11.5h17a8.5 8.5 0 0 1-17 0zM8.5 8c0-1.5 1.5-1.8 1.5-3.5M13 8c0-1.5 1.5-1.8 1.5-3.5"/></svg>Eat</button>
  <button data-a="tab" data-t="progress"><svg viewBox="0 0 24 24"><path d="M3 20.5h18M5.5 16l4-5 3.5 3 5.5-7.5"/></svg>Progress</button>
  <button data-a="tab" data-t="settings"><svg viewBox="0 0 24 24"><path d="M4 6.5h9M18 6.5h2M4 12h3M11 12h9M4 17.5h11M19 17.5h1"/><circle cx="15.5" cy="6.5" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="17" cy="17.5" r="2.2"/></svg>Settings</button>
</nav>

<script>
'use strict';
/* =========================================================================
   RECOMP: personal body-recomposition tracker (single-file PWA)

   Sections
    1. Utilities (formatting, dates)
    2. Storage: IndexedDB with an in-memory mirror (S)
    3. Seed data: targets, foods, exercises, templates
    4. Domain logic: targets, totals, rotation, progression, PRs, trends,
       14-day adjustment, protein-gap hint, weekly summary
    5. UI framework: render loop, event delegation, sheets, toasts, rest timer
    6. Today view
    7. Train view
    8. Eat view + natural-language meal parser
    9. Progress view + charts + weekly check-in
   10. Settings view + editors + export/import/reset
   11. Boot (+ dev-only fake-data seeder, enabled with ?dev=1)

   Data rules: dates are local YYYY-MM-DD strings. Everything shown is derived
   from raw logs at render time; no computed totals are stored.
   ========================================================================= */

/* =========================================================================
   1. UTILITIES
   ========================================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const round = (v, d = 0) => { const p = 10 ** d; return Math.round((+v + Number.EPSILON) * p) / p; };
const sum = a => a.reduce((s, x) => s + (+x || 0), 0);
const num = v => (v === '' || v == null || isNaN(v)) ? null : +v;
const avg = a => { const v = a.map(num).filter(x => x != null); return v.length ? sum(v) / v.length : null; };

   2. STORAGE
   IndexedDB is the source of truth; S mirrors every store in memory so the
   UI renders synchronously with no spinners. Writes go to both.
   ========================================================================= */
const DB_NAME = 'recomp', DB_VER = 1;
const STORES = {
  kv: 'key',            // profile, settings, supplements, decisions, last_export
  targets: 'id',        // targets_history
  daily: 'date',        // weight, steps, sleep, water, energy, supplements, note
  foods: 'id',          // food library
  saved_meals: 'id',    // named multi-item meals ("Usual lunch")
  meals: 'id',          // one record per date + slot
  exercises: 'id',
  templates: 'id',
  workouts: 'id',       // includes the active session (status: 'active')
  measurements: 'date',
  photos: 'id',         // progress photos as JPEG blobs
};
const S = Object.fromEntries(Object.keys(STORES).map(k => [k, {}]));

const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('IndexedDB not supported'));
      const r = indexedDB.open(DB_NAME, DB_VER);
      r.onupgradeneeded = () => {
        const db = r.result;
        for (const [n, k] of Object.entries(STORES)) if (!db.objectStoreNames.contains(n)) db.createObjectStore(n, { keyPath: k });
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('Database blocked'));
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode), s = t.objectStore(store);
      let out; const r = fn(s);
      if (r && 'onsuccess' in r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  all(store) { return this.tx(store, 'readonly', s => s.getAll()); },
  put(store, obj) { return this.tx(store, 'readwrite', s => s.put(obj)); },
  del(store, key) { return this.tx(store, 'readwrite', s => s.delete(key)); },
  clear(store) { return this.tx(store, 'readwrite', s => s.clear()); },
  putMany(store, arr) { return this.tx(store, 'readwrite', s => { arr.forEach(o => s.put(o)); }); },
};

async function loadAll() {
  for (const s of Object.keys(STORES)) {
    S[s] = {};
    for (const r of await DB.all(s)) S[s][r[STORES[s]]] = r;
  }
}
async function save(store, obj) {
  S[store][obj[STORES[store]]] = obj;
  if (!DB.db) return;
  try { await DB.put(store, obj); } catch (e) { console.error(e); toast('Couldn’t save to storage'); }
}
async function saveMany(store, arr) {
  arr.forEach(o => { S[store][o[STORES[store]]] = o; });
  if (!DB.db) return;
  try { await DB.putMany(store, arr); } catch (e) { console.error(e); toast('Couldn’t save to storage'); }
}
async function remove(store, key) {
  const old = S[store][key];
  delete S[store][key];
  if (DB.db) { try { await DB.del(store, key); } catch (e) { console.error(e); toast('Couldn’t delete from storage'); } }
  return old;
}
async function clearAll() {
  for (const s of Object.keys(STORES)) {
    S[s] = {};
    if (DB.db) { try { await DB.clear(s); } catch (e) { console.error(e); } }
  }
}

function targetsOn(date) {
  const list = targetsList(); let t = list[0];
  for (const x of list) if (x.effective_date <= date) t = x;
  return { ...DEFAULT_TARGETS, ...t };
}

function dayInfo(date = today()) {
  const p = P(), n = diffDays(p.start_date, date) + 1, total = p.weeks * 7;
  return { n, week: Math.max(1, Math.ceil(n / 7)), total, done: n > total };
}
const isEaseIn = (date = today()) => { const i = dayInfo(date); return i.n >= 1 && i.n <= 14; };

const daily = d => S.daily[d] || {};
function updDaily(d, patch) {
  const o = { date: d, ...daily(d), ...patch };
  for (const k of Object.keys(patch)) if (patch[k] == null) delete o[k];
  return save('daily', o);

const SLOTS = ['Breakfast', 'Lunch', 'Snacks', 'Dinner', 'Post-workout'];
const mealsOn = d => Object.values(S.meals).filter(m => m.date === d).sort((a, b) => SLOTS.indexOf(a.slot) - SLOTS.indexOf(b.slot));
const MACROS = ['kcal', 'protein', 'carbs', 'fat'];
function itemFromFood(f, qty) {
  const it = { food_id: f.id, name: f.name, unit: f.portion_label, qty: round(qty, 2) };
  for (const k of MACROS) it[k] = round((+f[k] || 0) * qty, 1);
  if (f.fibre != null && f.fibre !== '') it.fibre = round(+f.fibre * qty, 1);
  return it;
}
function dayTotals(d) {
  const t = { kcal: 0, protein: 0, carbs: 0, fat: 0, fibre: 0, hasFibre: false, items: 0 };
  for (const m of mealsOn(d)) for (const it of m.items) {
    for (const k of MACROS) t[k] += +it[k] || 0;
    if (it.fibre != null) { t.fibre += +it.fibre; t.hasFibre = true; }
    t.items++;
  }
  const ws = wheySupp(), sc = ws ? +suppVal(d, ws.id) || 0 : 0;
  if (sc) {
    const it = itemFromFood(S.foods[ws.food_id], sc);
    for (const k of MACROS) t[k] += it[k];
    if (it.fibre != null) { t.fibre += it.fibre; t.hasFibre = true; }
    t.items++;
  }
  return t;
}
const foodLogged = d => mealsOn(d).some(m => m.items.length) || (wheySupp() && +suppVal(d, wheySupp().id) > 0);

const proteinColor = (v, t, final) => v >= t ? 'var(--accent)' : v >= 0.85 * t ? 'var(--amber)' : final ? 'var(--red)' : 'var(--neutral)';
const kcalColor = (v, t, final) => v > t.kcal_max + 100 ? 'var(--red)' : v > t.kcal_max ? 'var(--amber)' : v >= t.kcal_min ? 'var(--accent)' : (final && v < t.kcal_min - 300 ? 'var(--amber)' : 'var(--neutral)');
const fatColor = (v, t) => v > t.fat_max + 10 ? 'var(--red)' : v > t.fat_max ? 'var(--amber)' : v >= t.fat_min ? 'var(--accent)' : 'var(--neutral)';
const macroRow = (label, v, target, { unit = 'g', color = 'var(--neutral)', note = '' } = {}) =>
  `<div class="mrow"><div class="row between"><span>${label}</span><span class="num"><b>${fmt(v)}</b> <span class="muted">/ ${fmt(target)} ${unit}${note}</span></span></div>${bar(v / target, color)}</div>`;
const shortName = x => String(x && x.name != null ? x.name : x).replace(/\s*\([^)]*\)/g, '').trim();
const fmtQty = q => String(round(+q, 2));
const titleCase = s => String(s).replace(/\b[a-z]/g, c => c.toUpperCase());

/* =========================================================================
   6. TODAY
   ========================================================================= */
VIEWS.today = () => {
  const d = curDate(), isT = d === today(), final = d < today(), p = P();
  const info = dayInfo(d), t = targetsOn(d), tot = dayTotals(d), x = daily(d);
  const sub = info.n < 1 ? 'Before your start date' : info.done ? `Day ${info.n} · ${p.weeks}-week block complete` : `Day ${info.n} of ${info.total} · Week ${info.week} of ${p.weeks}`;
  let h = header(isT ? `Today <span class="sub" style="font-weight:500;letter-spacing:0">${prettyDate(d)}</span>` : prettyDate(d), sub, dateNav(d));
  if (isT) h += promptsHTML();

  // Rings: protein first, it's the #1 priority
  const pLeft = t.protein - tot.protein, kLeft = t.kcal - tot.kcal;
  h += `<section class="card"><div class="rings">
    <div class="ringbox">${ring(tot.protein / t.protein, proteinColor(tot.protein, t.protein, final), 170, 15)}
      <div class="ringtxt"><div class="lbl">Protein</div><div class="big num">${pLeft > 0 ? fmt(pLeft) : '✓'}</div><div class="lbl">${pLeft > 0 ? 'g left' : `hit · +${fmt(-pLeft)} g`}</div><div class="tiny muted num mt-s">${fmt(tot.protein)} / ${t.protein} g</div></div></div>
    <div class="ringbox">${ring(tot.kcal / t.kcal, kcalColor(tot.kcal, t, final), 140, 12)}
      <div class="ringtxt"><div class="lbl">Calories</div><div class="mid num">${fmt(Math.abs(kLeft))}</div><div class="lbl">${kLeft >= 0 ? 'kcal left' : 'kcal over'}</div><div class="tiny muted num mt-s">${fmt(tot.kcal)} / ${fmt(t.kcal)}</div></div></div>
    </div>
    ${macroRow('Fat', tot.fat, t.fat, { color: fatColor(tot.fat, t) })}
    ${macroRow('Carbs', tot.carbs, t.carbs)}
    ${tot.hasFibre ? macroRow('Fibre', tot.fibre, t.fibre, { color: tot.fibre >= t.fibre ? 'var(--accent)' : 'var(--neutral)' }) : ''}
    ${tot.items ? '' : `<p class="empty mt">No food logged ${isT ? 'yet' : 'this day'}. After a week of logging, most meals take one tap.</p>`}
    <button class="btn ghost block mt-s" data-a="tab" data-t="eat">Log food →</button></section>`;

  // Daily check
  const ma = ma7(d), stepsCls = x.steps == null ? '' : x.steps >= t.steps_goal ? 'ok' : x.steps >= t.steps_min ? 'ok' : 'warn';
  const water = +x.water_ml || 0, anyWeight = Object.values(S.daily).some(r => r.weight != null);
  h += `<section class="card"><h2>Daily check</h2><div class="g3">
    <button class="tile" data-a="q" data-k="weight"><span class="lbl">Weight</span><span class="val num">${x.weight != null ? `${fmtW(x.weight)}<small> kg</small>` : '<span class="faint">+ log</span>'}</span><span class="tiny muted">${ma.n ? `7-day ${fmt(ma.v, 1)}` : '&nbsp;'}</span></button>
    <button class="tile" data-a="q" data-k="steps"><span class="lbl">Steps</span><span class="val num ${stepsCls}">${x.steps != null ? fmt(x.steps) : '<span class="faint">+ log</span>'}</span><span class="tiny muted">min ${fmt(t.steps_min)}</span></button>
    <button class="tile" data-a="q" data-k="sleep"><span class="lbl">Sleep</span><span class="val num ${x.sleep_h != null ? (x.sleep_h >= t.sleep_h ? 'ok' : 'warn') : ''}">${x.sleep_h != null ? `${fmt(x.sleep_h, x.sleep_h % 1 ? 1 : 0)}<small> h</small>` : '<span class="faint">+ log</span>'}</span><span class="tiny muted">goal ${t.sleep_h}+ h</span></button>
    </div>
    ${anyWeight ? '' : '<p class="small muted mt-s">Log your morning weight to start your trend.</p>'}
    <div class="row mt"><div class="grow"><div class="row between"><span class="lbl">Water</span><span class="num small"><b>${fmt(water / 1000, 2)}</b> <span class="muted">/ ${fmt(t.water_ml / 1000, 1)} L</span></span></div>${bar(water / t.water_ml, water >= t.water_ml ? 'var(--accent)' : 'var(--neutral)')}</div>
      <button class="icon-btn" data-a="water" data-d="-250" aria-label="Remove 250 ml">−</button><button class="btn primary" data-a="water" data-d="250">+250 ml</button></div>
    <div class="row mt"><span class="lbl" style="width:52px">Energy</span><div class="seg grow">${[1, 2, 3, 4, 5].map(n => `<button class="${x.energy === n ? 'on' : ''}" data-a="energy" data-v="${n}">${n}</button>`).join('')}</div></div>
    <textarea class="input mt" rows="1" style="min-height:44px" placeholder="Note for the day (optional)" data-c="day-note">${esc(x.note || '')}</textarea></section>`;

  // Supplements
  h += `<section class="card"><h2>Supplements</h2>${supps().map(s => {
    const v = suppVal(d, s.id);
    if (s.kind === 'count') {
      const f = s.food_id && S.foods[s.food_id], n = +v || 0;
      return `<div class="supp"><span class="box ${n ? 'on' : ''}">${n || ''}</span><span class="grow">${esc(s.name)} <span class="muted small">${n} ${esc(s.dose || '')}${f ? ` · ${fmt(f.protein * n)} g protein` : ''}</span></span><button class="icon-btn" data-a="suppn" data-id="${s.id}" data-d="-1" aria-label="Less">−</button><button class="icon-btn" data-a="suppn" data-id="${s.id}" data-d="1" aria-label="More">+</button></div>`;
    }
    return `<button class="supp" data-a="supp" data-id="${s.id}"><span class="box ${v ? 'on' : ''}">${v ? '✓' : ''}</span><span class="grow">${esc(s.name)} <span class="muted small">${esc(s.dose || '')}</span></span></button>`;
  }).join('')}</section>`;

  // Workout
  if (isT) {
    const act = activeWorkout(), ws = weekSessions(d);
    if (act) {
      const tot2 = sum(act.exercises.map(e => e.sets.length)), done = sum(act.exercises.map(e => e.sets.filter(s => s.done).length));
      h += `<section class="card accent"><h2>Workout in progress</h2><div class="row"><div class="grow"><div class="title">${esc(act.name)}</div><div class="small muted">${done}/${tot2} sets · started ${clock(act.started_at)}</div></div><button class="btn primary" data-a="tab" data-t="train">Resume</button></div></section>`;
    } else {
      const nt = nextTemplate();
      if (nt) h += `<section class="card"><h2>Next workout<span class="num">${ws.lift}/${t.sessions_goal} this week</span></h2><div class="row"><div class="grow"><div class="title" style="font-size:20px">${esc(nt.name)}</div><div class="tiny muted ellip">${nt.exercises.map(e => esc(shortName(exById(e.exercise_id)))).join(' · ')}</div></div><button class="btn primary" data-a="start" data-id="${nt.id}">Start</button></div>${isEaseIn() ? '<p class="small mt-s warn">Ease-in weeks: 2 sets per exercise, leave 3 reps in the tank.</p>' : ''}</section>`;
    }
    const st = loggingStreak();
    h += `<section class="card"><div class="g3 stats"><div><div class="lbl">Logging streak</div><div class="val num">${st}<small> ${st === 1 ? 'day' : 'days'}</small></div></div><div><div class="lbl">Gym this week</div><div class="val num ${ws.lift >= t.sessions_min ? 'ok' : ''}">${ws.lift}<small> / ${t.sessions_goal}</small></div></div><div><div class="lbl">Cardio this week</div><div class="val num ${ws.cardio >= t.cardio_min ? 'ok' : ''}">${ws.cardio}<small> / ${t.cardio_min}–${t.cardio_max}</small></div></div></div>${!isLogged(d) && st ? '<p class="tiny muted mt-s">Log anything today to keep the streak.</p>' : ''}</section>`;
  } else {
    const ws = Object.values(S.workouts).filter(w => w.date === d && w.status === 'done');
    h += `<section class="card"><h2>Workouts this day</h2>${ws.length ? `<div class="list">${ws.map(w => `<button class="li" data-a="wk-open" data-id="${w.id}"><span class="grow">${esc(w.name)}</span><span class="faint">›</span></button>`).join('')}</div>` : '<p class="empty">None logged.</p>'}</section>`;
  }
  return h;
};

function promptsHTML() {
  let h = '';
  if (!DB.db) h += `<div class="banner">Storage is unavailable (private browsing?). Nothing will be saved.</div>`;
  const a = adjustment();
  if (a) h += `<section class="card ${a.kind === 'hold' ? 'accent' : 'amber'}"><h2>14-day review</h2><div class="title">${esc(a.title)}</div><p class="small mt-s">${esc(a.body)}</p><p class="tiny muted mt-s">${esc(a.facts)}</p>${a.delta
    ? `<div class="g2 mt"><button class="btn" data-a="adj" data-v="dismiss">Dismiss</button><button class="btn primary" data-a="adj" data-v="accept">Apply ${a.delta > 0 ? '+' : '−'}${Math.abs(a.delta)} kcal</button></div>`
    : `<button class="btn block mt" data-a="adj" data-v="ok">Got it</button>`}</section>`;
  const ms = measList(), info = dayInfo();
  if (!ms.length) h += `<section class="card"><h2>Baseline</h2><p class="small">Take your baseline measurements. Waist and neck give you a body-fat estimate; photos give you something to compare against. About 2 minutes with a tape.</p><button class="btn primary block mt" data-a="checkin">Start baseline check-in</button></section>`;
  else {
    const since = diffDays(ms[ms.length - 1].date, today()), isDay = new Date().getDay() === (SET().checkin_day ?? 0);
    if ((isDay && since >= 3) || since >= 8) h += `<section class="card"><h2>Weekly check-in</h2><p class="small">${isDay ? 'It’s check-in day.' : `Last check-in was ${since} days ago.`} Measure waist, neck, chest, arm, hips and thigh, and take front, side and back photos.</p><button class="btn primary block mt" data-a="checkin">Do check-in</button></section>`;
  }
  const le = kv('last_export'), snooze = kv('backup_snooze');
  if (info.n >= 7 && (!le || diffDays(le, today()) >= 7) && (!snooze || diffDays(snooze, today()) >= 3))
    h += `<section class="card"><h2>Backup</h2><p class="small">${le ? `Last backup was ${diffDays(le, today())} days ago.` : 'You haven’t backed up yet.'} iOS can clear web-app storage, so save a copy to Files or iCloud Drive each week.</p><div class="g2 mt"><button class="btn" data-a="backup-snooze">Later</button><button class="btn primary" data-a="export">Export now</button></div></section>`;
  if (info.n >= 2 && daily(addDays(today(), -1)).steps == null) h += `<button class="btn block mb" data-a="q" data-k="steps" data-date="${addDays(today(), -1)}">+ Add yesterday’s steps (from Health)</button>`;
  return h;
}
A['backup-snooze'] = async () => { await setKv('backup_snooze', today()); rerender(); };
A.adj = async ({ v }) => {
  const a = adjustment(); if (!a) return;
  const dec = { ...(kv('adjust_decisions', {}) || {}) };
  dec[a.period] = { v, date: today(), kind: a.kind };
  if (v === 'accept' && a.delta) {
    const t = targetsOn(today()), s = Math.sign(a.delta);
    await save('targets', { ...t, id: 't_' + uid(), effective_date: today(), created: Date.now(), kcal: t.kcal + a.delta, kcal_min: t.kcal_min + a.delta, kcal_max: t.kcal_max + a.delta, carbs: t.carbs + 20 * s, fat: t.fat + 5 * s, fat_min: t.fat_min + 5 * s, fat_max: t.fat_max + 5 * s, reason: `14-day review (day ${dayInfo().n}): ${a.title}. ${a.facts}` });
    toast(`Targets updated: ${t.kcal + a.delta} kcal`);
  }
  await setKv('adjust_decisions', dec); rerender();
};

A.q = ({ k, date }) => {
  const d = date || curDate(), x = daily(d), lbl = d === today() ? '' : ` · ${prettyDate(d)}`;
  if (k === 'weight') numberSheet({ title: 'Morning weight' + lbl, value: x.weight ?? latestWeight(d) ?? P().start_weight, step: 0.1, decimals: 1, min: 30, max: 250, unit: 'kg', help: 'After waking and the bathroom, before food or water. Daily swings of ±1 kg are normal; the 7-day average is what counts.', onSave: v => updDaily(d, { weight: v }) });
  if (k === 'steps') numberSheet({ title: 'Steps' + lbl, value: x.steps ?? '', placeholder: '0', step: 500, min: 0, max: 100000, unit: 'steps', presets: [6000, 8000, 10000, 12000], focus: true, help: 'From iPhone Health → Steps. The full-day total is easiest to enter the next morning.', onSave: v => updDaily(d, { steps: v }) });
  if (k === 'sleep') numberSheet({ title: 'Sleep' + lbl, value: x.sleep_h ?? 7, step: 0.5, decimals: 1, min: 0, max: 16, unit: 'hours', presets: [6, 6.5, 7, 7.5, 8, 8.5], onSave: v => updDaily(d, { sleep_h: v }) });
};
A.water = ({ d }) => { const dt = curDate(); updDaily(dt, { water_ml: Math.max(0, (+daily(dt).water_ml || 0) + +d) || null }); rerender(); };
A.energy = ({ v }) => { const dt = curDate(); updDaily(dt, { energy: daily(dt).energy === +v ? null : +v }); rerender(); };
A.supp = ({ id }) => { const dt = curDate(); setSupp(dt, id, suppVal(dt, id) ? null : true); rerender(); };
A.suppn = ({ id, d }) => { const dt = curDate(); setSupp(dt, id, Math.max(0, (+suppVal(dt, id) || 0) + +d) || null); rerender(); };
C['day-note'] = el => { updDaily(curDate(), { note: el.value.trim() || null }); };

/* =========================================================================
   7. TRAIN
   ========================================================================= */
VIEWS.train = () => { const w = activeWorkout(); return w ? sessionView(w) : trainHome(); };
const repRange = (e, ex) => `${e.rep_min}${e.rep_max !== e.rep_min ? '–' + e.rep_max : ''}${ex.timed ? 's' : ''}`;

function trainHome() {
  const t = targetsOn(today()), ws = weekSessions(), nt = nextTemplate(), ease = isEaseIn();
  let h = header('Train', `${ws.lift} of ${t.sessions_goal} sessions · ${ws.cardio} cardio this week`);
  if (ease) h += `<div class="banner"><b>Ease-in weeks:</b> 2 sets per exercise, leave 3 reps in the tank.</div>`;
  if (nt) {
    h += `<section class="card accent"><h2>Next in rotation</h2><div class="title" style="font-size:22px">${esc(nt.name)}</div><div class="list mt-s">${nt.exercises.map(e => {
      const ex = exById(e.exercise_id), p = progression(e.exercise_id, e), n = ease ? Math.min(2, e.sets) : e.sets;
      return `<div class="li" style="min-height:46px"><div class="grow"><span class="ellip">${esc(ex.name)}</span><span class="tiny ${p.up ? 'ok' : 'muted'}">${n} × ${repRange(e, ex)} · ${esc(p.hint)}</span></div></div>`;
    }).join('')}</div><button class="btn primary block mt" data-a="start" data-id="${nt.id}">Start ${esc(nt.name)}</button></section>`;
  }
  const others = Object.values(S.templates).sort((a, b) => a.order - b.order).filter(x => !nt || x.id !== nt.id);
  h += `<section class="card"><h2>Other options</h2><div class="chips wrap">${others.map(x => `<button class="chip" data-a="start" data-id="${x.id}">${esc(x.name)}</button>`).join('')}<button class="chip" data-a="start" data-id="">Empty workout</button></div>
    <button class="btn block mt" data-a="cardio" data-target="standalone">+ Log cardio only</button></section>`;
  const hist = doneWorkouts().reverse();
  h += `<section class="card"><h2>History<span class="num">${hist.length}</span></h2>${hist.length ? `<div class="list">${hist.slice(0, UI.histLimit).map(w => {
    const sets = sum(w.exercises.map(e => e.sets.length)), prs = sum(w.exercises.map(e => e.sets.filter(s => s.pr).length));
    const cd = (w.cardio || []).map(c => `${cardioName(c.type)} ${c.minutes} min`).join(', ');
    return `<button class="li" data-a="wk-open" data-id="${w.id}"><div class="grow"><span class="ellip"><b>${esc(w.name)}</b> <span class="muted small">${prettyDate(w.date)}</span></span><span class="small muted ellip">${[sets ? plural(sets, 'set') : '', w.duration_min && sets ? w.duration_min + ' min' : '', cd].filter(Boolean).join(' · ')}</span></div>${prs ? `<span class="badge">${prs} PR</span>` : ''}<span class="faint">›</span></button>`;
  }).join('')}</div>${hist.length > UI.histLimit ? '<button class="btn ghost block" data-a="hist-more">Show more</button>' : ''}`
    : `<p class="empty">No workouts yet. Start ${nt ? esc(nt.name) : 'a workout'} above. Next time, your sets are pre-filled from this session.</p>`}</section>`;
  return h;
}
A['hist-more'] = () => { UI.histLimit += 20; rerender(); };

A.start = ({ id }) => {
  if (activeWorkout()) { UI.tab = 'train'; render(); return; }
  const t = id ? S.templates[id] : null, ease = isEaseIn(), wid = uid();
  save('workouts', { id: wid, date: today(), template_id: t ? t.id : null, name: t ? t.name : 'Workout', status: 'active', started_at: Date.now(), ease,
    exercises: t ? t.exercises.map(e => buildSessionExercise(e, ease, wid)) : [], cardio: [], note: '' });
  UI.tab = 'train'; UI.date = null; render(); window.scrollTo(0, 0);
};

function sessionView(w) {
  const total = sum(w.exercises.map(e => e.sets.length)), done = sum(w.exercises.map(e => e.sets.filter(s => s.done).length));
  let h = header(esc(w.name), `Started ${clock(w.started_at)} · ${done}/${total} sets done`, `<button class="btn primary" data-a="wk-finish">Finish</button>`);
  h += w.ease ? `<div class="banner"><b>Ease-in weeks:</b> 2 sets per exercise, leave 3 reps in the tank.</div>` : `<p class="small muted mb">Finish each set 1–2 reps short of failure.</p>`;
  w.exercises.forEach((e, i) => { h += exCard(w, e, i); });
  if (!w.exercises.length) h += `<p class="card empty">Add an exercise to get started.</p>`;
  h += `<button class="btn block mb" data-a="ex-picker" data-mode="add">+ Add exercise</button>`;
  h += `<section class="card"><h2>Cardio</h2>${(w.cardio || []).map((c, k) => `<div class="li"><div class="grow">${cardioName(c.type)} · ${c.minutes} min${c.incline ? ` · ${c.incline}%` : ''}${c.speed ? ` · ${c.speed} km/h` : ''}<div class="tiny muted">≈ ${c.kcal_est} kcal (info only)</div></div><button class="icon-btn" data-a="cd-del" data-k="${k}" aria-label="Remove">✕</button></div>`).join('')
    || '<p class="empty">20–30 min of easy cardio after lifting counts toward your 2–3 weekly sessions.</p>'}<button class="btn block mt-s" data-a="cardio" data-target="session">+ Add cardio</button></section>`;
  h += `<section class="card"><h2>Session note</h2><textarea class="input" data-c="wk-note" placeholder="Energy, sleep, anything notable">${esc(w.note || '')}</textarea></section>`;
  h += `<div class="g2"><button class="btn danger" data-a="wk-discard">Discard</button><button class="btn primary" data-a="wk-finish">Finish workout</button></div>`;
  return h;
}

function exCard(w, e, i) {
  const ex = exById(e.exercise_id), hist = exHistory(e.exercise_id, w.id), last = hist[hist.length - 1];
  const lastStr = last ? `Last (${shortDate(last.date)}): ${last.sets.map(s => setStr(s, ex)).join(' · ')}` : 'First time logging this';
  const allDone = e.sets.length && e.sets.every(s => s.done);
  return `<section class="card ${allDone ? '' : ''}" id="ex${i}">
    <div class="row"><div class="grow"><div class="title">${allDone ? '<span class="ok">✓</span> ' : ''}${esc(ex.name)}</div><div class="small muted">${e.target_sets} × ${repRange(e, ex)} · rest ${mmss(e.rest_s)}</div></div><button class="icon-btn" data-a="ex-menu" data-i="${i}" aria-label="Exercise options">⋯</button></div>
    <div class="hint ${e.up ? 'up' : ''}">${esc(e.hint)}</div>
    <div class="tiny muted">${esc(lastStr)}</div>
    <div class="setrow head"><span>#</span><span>kg</span><span></span><span>${ex.timed ? 'sec' : 'reps'}</span><span></span><span></span></div>
    ${e.sets.map((s, j) => `<div class="setrow ${s.done ? 'done' : ''}">
      <span class="setn">${j + 1}</span>
      <input type="number" inputmode="decimal" step="any" value="${s.weight ?? ''}" placeholder="${ex.equipment === 'bodyweight' ? 'BW' : 'kg'}" data-c="set-f" data-f="weight" data-i="${i}" data-j="${j}" aria-label="Weight in kg">
      <button class="icon-btn" data-a="set-rep" data-i="${i}" data-j="${j}" data-d="-1" aria-label="Fewer">−</button>
      <input type="number" inputmode="numeric" value="${s.reps ?? ''}" data-c="set-f" data-f="reps" data-i="${i}" data-j="${j}" aria-label="${ex.timed ? 'Seconds' : 'Reps'}">
      <button class="icon-btn" data-a="set-rep" data-i="${i}" data-j="${j}" data-d="1" aria-label="More">+</button>
      <button class="tick ${s.done ? 'on' : ''} ${s.pr ? 'pr' : ''}" data-a="set-done" data-i="${i}" data-j="${j}" aria-label="Set done">✓</button></div>`).join('')}
    <div class="row between mt"><button class="btn sm ghost" data-a="set-add" data-i="${i}">+ Set</button>
      <div class="seg" style="width:190px">${[['easy', 'Easy'], ['ok', 'OK'], ['hard', 'Hard']].map(([v, l]) => `<button class="${e.feel === v ? 'on' : ''}" data-a="feel" data-i="${i}" data-v="${v}">${l}</button>`).join('')}</div></div>
  </section>`;
}

const act = () => activeWorkout();
C['set-f'] = el => {
  const w = act(); if (!w) return;
  const s = w.exercises[+el.dataset.i] && w.exercises[+el.dataset.i].sets[+el.dataset.j]; if (!s) return;
  const v = num(el.value); if ((v ?? '') === s[el.dataset.f]) return;
  s[el.dataset.f] = v ?? ''; save('workouts', w);
};
A['set-rep'] = ({ i, j, d }) => {
  const w = act(), e = w.exercises[+i], ex = exById(e.exercise_id), s = e.sets[+j];
  s.reps = Math.max(0, (num(s.reps) ?? e.rep_min) + (+d) * (ex.timed ? 5 : 1));
  save('workouts', w); rerender();
};
A['set-done'] = ({ i, j }) => {

A['wk-finish'] = () => {

    w.exercises = w.exercises.map(e => ({ ...e, sets: e.sets.filter(s => s.done) })).filter(e => e.sets.length);

/* =========================================================================
   8. EAT + MEAL PARSER
   ========================================================================= */
const autoSlot = () => {
  const lw = doneWorkouts().filter(isLift).pop();
  if (lw && lw.finished_at && Date.now() - lw.finished_at < 2 * 3600e3 && curDate() === today()) return 'Post-workout';
  const h = new Date().getHours();
  return h < 11 ? 'Breakfast' : h < 16 ? 'Lunch' : h < 19 ? 'Snacks' : 'Dinner';
};
const curSlot = () => UI.slot || autoSlot();

VIEWS.eat = () => {
  const d = curDate(), isT = d === today(), final = d < today(), t = targetsOn(d), tot = dayTotals(d), slot = curSlot();
  let h = header(isT ? 'Eat' : prettyDate(d), isT ? prettyDate(d) : 'Editing a past day', dateNav(d));
  const pLeft = t.protein - tot.protein, kLeft = t.kcal - tot.kcal;
  h += `<section class="card"><div class="g2"><div><div class="lbl">Protein left</div><div class="num" style="font-size:30px;font-weight:750;${pLeft <= 0 ? 'color:var(--accent)' : ''}">${pLeft > 0 ? `${fmt(pLeft)}<small class="muted" style="font-size:14px"> g</small>` : '✓ hit'}</div></div>
    <div><div class="lbl">Calories left</div><div class="num" style="font-size:30px;font-weight:750;${tot.kcal > t.kcal_max ? 'color:var(--red)' : ''}">${fmt(kLeft)}<small class="muted" style="font-size:14px"> kcal</small></div></div></div>
    ${macroRow('<b>Protein</b>', tot.protein, t.protein, { color: proteinColor(tot.protein, t.protein, final), note: ' min' })}
    ${macroRow('Calories', tot.kcal, t.kcal, { unit: 'kcal', color: kcalColor(tot.kcal, t, final) })}
    ${macroRow('Fat', tot.fat, t.fat, { color: fatColor(tot.fat, t) })}
    ${macroRow('Carbs', tot.carbs, t.carbs)}
    ${tot.hasFibre ? macroRow('Fibre', tot.fibre, t.fibre, { color: tot.fibre >= t.fibre ? 'var(--accent)' : 'var(--neutral)' }) : ''}</section>`;

  const g = proteinGap(d);
  if (g && tot.items) h += `<section class="card"><p class="small"><b>You need ${g.gap} g more protein.</b>${g.picks.length ? ` Options: ${g.picks.map(x => `${fmtQty(x.q)} × ${esc(shortName(x.f))} (${fmt(x.p)} g)`).join(' + ')}` : ''}</p>${g.picks.length ? `<div class="chips wrap mt-s">${g.picks.map(x => `<button class="chip soft" data-a="gap-add" data-id="${x.f.id}" data-q="${x.q}">+ ${fmtQty(x.q)} ${esc(shortName(x.f))}</button>`).join('')}</div>` : ''}</section>`;

  // Add food: fastest first
  const yMeals = mealsOn(addDays(d, -1)).filter(m => m.items.length);
  const saved = Object.values(S.saved_meals).sort((a, b) => (b.last_used || 0) - (a.last_used || 0));
  const recent = Object.values(S.foods).filter(f => f.last_used).sort((a, b) => b.last_used - a.last_used).slice(0, 10);
  const favs = Object.values(S.foods).filter(f => f.favourite && !recent.includes(f));
  h += `<section class="card"><h2>Add to</h2><div class="chips">${SLOTS.map(s => `<button class="chip ${s === slot ? 'on' : ''}" data-a="slot" data-v="${s}">${s}</button>`).join('')}</div>`;
  if (yMeals.length || saved.length || recent.length || favs.length) {
    h += `<div class="lbl mt">One tap</div><div class="chips wrap mt-s">${
      yMeals.map(m => `<button class="chip soft" data-a="repeat" data-m="${m.id}">↻ Yesterday’s ${m.slot.toLowerCase()} · ${fmt(sum(m.items.map(i => i.kcal)))} kcal</button>`).join('')}${
      saved.map(s => `<button class="chip soft" data-a="saved-add" data-id="${s.id}">★ ${esc(s.name)}</button>`).join('')}${
      [...favs, ...recent].map(f => `<button class="chip" data-a="food-quick" data-id="${f.id}">${f.favourite ? '★ ' : ''}${esc(shortName(f))}</button>`).join('')}</div>`;
  } else h += `<p class="empty mt-s">Yesterday’s meals, saved meals and recent foods show up here as one-tap buttons.</p>`;
  h += `<div class="lbl mt">Type what you ate</div><textarea class="input mt-s" id="nlText" rows="2" data-in="nl" placeholder="2 roti, 1 katori dal, bhindi sabzi, 1 katori curd">${esc(UI.nlText)}</textarea><button class="btn primary block mt-s" data-a="nl-parse">Review & add</button>`;
  h += `<div class="lbl mt">Search food library</div><input class="input mt-s" type="search" placeholder="roti, dal, paneer…" data-in="food-q" value="${esc(UI.foodQ)}" autocomplete="off"><div class="list" id="foodResults">${foodResults(UI.foodQ)}</div></section>`;

  const meals = mealsOn(d).filter(m => m.items.length);
  for (const m of meals) {
    h += `<section class="card"><h2>${m.slot}<span class="num">${fmt(sum(m.items.map(i => i.kcal)))} kcal · ${fmt(sum(m.items.map(i => i.protein)))} g P</span></h2><div class="list">${m.items.map((it, n) =>
      `<button class="li" data-a="item-edit" data-m="${m.id}" data-k="${n}"><div class="grow"><span class="ellip">${fmtQty(it.qty)} × ${esc(it.name)}</span><span class="tiny muted ellip">${esc(it.unit || '')} · ${fmt(it.kcal)} kcal · P ${fmt(it.protein, 1)} · C ${fmt(it.carbs)} · F ${fmt(it.fat)}</span></div><span class="faint">›</span></button>`).join('')}</div>
      <div class="row mt-s"><button class="btn sm ghost" data-a="meal-save" data-m="${m.id}">☆ Save as meal</button>${isT ? '' : `<button class="btn sm ghost" data-a="meal-copy" data-m="${m.id}">Copy to today</button>`}<span class="grow"></span><button class="btn sm ghost danger" data-a="meal-del" data-m="${m.id}">Clear</button></div></section>`;
  }
  const ws = wheySupp();
  if (ws) {
    const f = S.foods[ws.food_id], sc = +suppVal(d, ws.id) || 0;
    h += `<section class="card"><h2>Supplements<span class="num">${fmt(f.kcal * sc)} kcal · ${fmt(f.protein * sc)} g P</span></h2><div class="row"><div class="grow">${esc(f.name)}<div class="tiny muted">${esc(f.portion_label)} each · synced with Today</div></div><button class="icon-btn" data-a="suppn" data-id="${ws.id}" data-d="-1" aria-label="Less">−</button><span class="num" style="width:26px;text-align:center;font-weight:750">${sc}</span><button class="icon-btn" data-a="suppn" data-id="${ws.id}" data-d="1" aria-label="More">+</button></div></section>`;
  }
  if (!meals.length) h += `<p class="card empty">Nothing logged for ${isT ? 'today' : 'this day'} yet. Try typing “2 roti, 1 katori dal, bhindi sabzi, 1 katori curd” above.</p>`;
  h += `<button class="btn ghost block" data-a="sample-day">See a sample day that hits your targets</button>`;
  return h;
};
A.slot = ({ v }) => { UI.slot = v; rerender(); };
IN.nl = el => { UI.nlText = el.value; };

// ---- Adding food (whey is routed to the supplement counter so it's never double counted) ----
async function addItems(date, slot, items) {
  const ws = wheySupp(); let wheyAdd = 0; const rest = [];
  for (const it of items) { if (ws && it.food_id === ws.food_id) wheyAdd += +it.qty; else rest.push(it); }
  const existing = mealsOn(date).find(m => m.slot === slot), prevMeal = existing ? clone(existing) : null;
  const prevWhey = ws ? +suppVal(date, ws.id) || 0 : 0;
  let meal = null;
  if (rest.length) { meal = existing ? { ...existing, items: [...existing.items, ...rest] } : { id: uid(), date, slot, items: rest }; await save('meals', meal); }
  if (wheyAdd) await setSupp(date, ws.id, round(prevWhey + wheyAdd, 2));
  const now = Date.now();
  for (const it of items) { const f = S.foods[it.food_id]; if (f) { f.last_used = now; f.uses = (f.uses || 0) + 1; save('foods', f); } }
  return async () => {
    if (meal) { if (prevMeal) await save('meals', prevMeal); else await remove('meals', meal.id); }
    if (wheyAdd) await setSupp(date, ws.id, prevWhey || null);
  };
}
async function addAndToast(date, slot, items, label) { const undo = await addItems(date, slot, items); rerender(); toast(label || `Added to ${slot}`, { undo }); }
const refreshItem = it => { const f = S.foods[it.food_id]; return f ? itemFromFood(f, it.qty) : clone(it); };
const saveOrRemoveMeal = m => (m.items.length ? save('meals', m) : remove('meals', m.id));

A['food-quick'] = ({ id }) => { const f = S.foods[id], s = curSlot(); addAndToast(curDate(), s, [itemFromFood(f, 1)], `Added ${shortName(f)} to ${s}`); };
A['gap-add'] = ({ id, q }) => { const f = S.foods[id], s = curSlot(); addAndToast(curDate(), s, [itemFromFood(f, +q)], `Added ${shortName(f)} to ${s}`); };
A.repeat = ({ m }) => { const src = S.meals[m]; addAndToast(curDate(), src.slot, src.items.map(refreshItem), `Repeated yesterday’s ${src.slot.toLowerCase()}`); };
A['meal-copy'] = async ({ m }) => { const src = S.meals[m], undo = await addItems(today(), src.slot, src.items.map(refreshItem)); toast(`Copied to today’s ${src.slot.toLowerCase()}`, { undo }); };
A['saved-add'] = ({ id }) => { const sm = S.saved_meals[id], s = curSlot(); sm.last_used = Date.now(); save('saved_meals', sm); addAndToast(curDate(), s, sm.items.map(refreshItem), `Added ${sm.name} to ${s}`); };
A['meal-del'] = ({ m }) => { const before = clone(S.meals[m]); remove('meals', m); rerender(); toast(`Cleared ${before.slot}`, { undo: () => save('meals', before) }); };

// ---- Library search + quantity sheet ----
function foodResults(q) {
  const n = norm(q); if (!n) return '';
  const qt = tokens(n);

const NUMWORDS = { half: 0.5, aadha: 0.5, quarter: 0.25, a: 1, an: 1, one: 1, ek: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, dedh: 1.5, dhai: 2.5, couple: 2 };

function lev(a, b) {

  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

}
function tokEq(a, b) {

}

    .replace(/(\d+)\s*\/\s*(\d+)/g, (_, a, b) => ` ${round(+a / +b, 2)} `).replace(/\([^)]*\)/g, ' ');
  for (const part of src.split(/,|\+|;|\n|&|\band\b|\baur\b|\bwith\b(?!\s+(?:ghee|butter|sugar|milk|oil)\b)/)) {
    const raw = part.trim(); if (!raw) continue;

    if (gm) { amount = +gm[1]; s = s.replace(gm[0], ' '); }

    const name = norm(s); if (!name) continue;
    const hit = matchFood(name);

    out.push({ raw, name, food_id: hit ? hit.f.id : null, qty: q || 1 });

// ---- Weekly summary (plain text for pasting into Claude) ----
function weeklySummary() {
  const end = today(), start = addDays(end, -6), p = P(), t = targetsOn(end), info = dayInfo(end), days = dateRange(start, end);
  const dn = d => DOW[parseD(d).getDay()];
  const L = [], ln = s => L.push(s);
  ln(`RECOMP WEEKLY SUMMARY: ${prettyDate(start)} to ${prettyDate(end)} (week ${Math.min(info.week, p.weeks)} of ${p.weeks}, day ${info.n})`);
  ln(`Me: male, ${p.age} y, ${p.height} cm. Goal: body recomposition (lose ~5-6 kg fat, gain ~2-3 kg muscle over ${p.weeks} weeks). Start ${fmtW(p.start_weight)} kg on ${p.start_date}; goal ${p.goal_min}-${p.goal_max} kg. Mostly vegetarian home-cooked Indian food plus eggs.`);
  ln(`Targets: ${t.kcal} kcal (band ${t.kcal_min}-${t.kcal_max}), protein ${t.protein} g minimum, fat ${t.fat} g, carbs ~${t.carbs} g, steps ${t.steps_min}+ (goal ${t.steps_goal}), water ${t.water_ml / 1000} L, sleep ${t.sleep_h}+ h, ${t.sessions_min}-${t.sessions_goal} lifting + ${t.cardio_min}-${t.cardio_max} cardio sessions/week.`);
  ln('');
  const now = ma7(end), prev = ma7(addDays(end, -7));
  ln('WEIGHT');
  ln(`- Daily: ${days.map(d => `${dn(d)} ${weightOn(d) != null ? fmtW(weightOn(d)) : '-'}`).join(', ')}`);
  ln(`- 7-day average ${now.n ? fmt(now.v, 2) + ' kg' : 'n/a'} (previous week ${prev.n ? fmt(prev.v, 2) + ' kg' : 'n/a'}${now.n && prev.n ? `, change ${signed(now.v - prev.v, 2)} kg` : ''}). Since start: ${now.n ? signed(now.v - p.start_weight, 1) + ' kg' : 'n/a'}.`);
  ln('');
  ln('NUTRITION');
  const logged = days.filter(foodLogged);
  if (!logged.length) ln('- No food logged this week.');
  else {
    const tt = logged.map(d => ({ d, ...dayTotals(d), tg: targetsOn(d) }));
    ln(`- Days logged: ${logged.length}/7. Averages: ${fmt(avg(tt.map(x => x.kcal)))} kcal, protein ${fmt(avg(tt.map(x => x.protein)))} g, fat ${fmt(avg(tt.map(x => x.fat)))} g, carbs ${fmt(avg(tt.map(x => x.carbs)))} g${tt.some(x => x.hasFibre) ? `, fibre ~${fmt(avg(tt.map(x => x.fibre)))} g` : ''}.`);
    ln(`- Protein target hit ${tt.filter(x => x.protein >= x.tg.protein).length}/${logged.length} days. Calories within band ${tt.filter(x => x.kcal >= x.tg.kcal_min && x.kcal <= x.tg.kcal_max).length}/${logged.length} days.`);
    ln(`- Per day: ${tt.map(x => `${dn(x.d)} ${fmt(x.kcal)} kcal/${fmt(x.protein)} g P`).join('; ')}`);
    const counts = {};
    for (const d of logged) for (const m of mealsOn(d)) for (const it of m.items) counts[shortName(it)] = (counts[shortName(it)] || 0) + +it.qty;
    const top = Object.entries(counts).sort((x, y) => y[1] - x[1]).slice(0, 8);
    if (top.length) ln(`- Most eaten (portions): ${top.map(([n, q]) => `${n} x${fmtQty(q)}`).join(', ')}`);
  }
  ln('');
  const xs = days.map(daily), steps = xs.map(x => x.steps).filter(v => v != null), sleep = xs.map(x => x.sleep_h).filter(v => v != null);
  const water = xs.map(x => x.water_ml).filter(Boolean), energy = xs.map(x => x.energy).filter(Boolean);
  ln('ACTIVITY & RECOVERY');
  ln(`- Steps: avg ${steps.length ? fmt(avg(steps)) : 'n/a'} (${steps.length}/7 days logged, ${steps.filter(v => v >= t.steps_min).length} days at ${t.steps_min}+).`);
  ln(`- Sleep: avg ${sleep.length ? fmt(avg(sleep), 1) + ' h' : 'n/a'} (${sleep.filter(v => v >= t.sleep_h).length} nights at ${t.sleep_h}+ h). Water: avg ${water.length ? fmt(avg(water) / 1000, 1) + ' L' : 'n/a'}. Energy: avg ${energy.length ? fmt(avg(energy), 1) + '/5' : 'n/a'}.`);
  ln(`- Supplements: ${supps().map(s => s.kind === 'count' ? `${s.name} avg ${fmt(avg(days.map(d => +suppVal(d, s.id) || 0)), 1)}/day` : `${s.name} ${days.filter(d => suppVal(d, s.id)).length}/7`).join(', ')}`);
  ln('');
  const wk = doneWorkouts().filter(w => w.date >= start && w.date <= end), lifts = wk.filter(isLift);
  const cardio = wk.flatMap(w => (w.cardio || []).map(c => ({ ...c, date: w.date })));
  ln('TRAINING');
  ln(`- Lifting sessions: ${lifts.length} (target ${t.sessions_min}-${t.sessions_goal}). Cardio sessions: ${cardio.length} (target ${t.cardio_min}-${t.cardio_max}).`);
  for (const w of lifts) {
    ln(`- ${dn(w.date)} ${w.name}${w.duration_min ? ` (${w.duration_min} min)` : ''}${w.ease ? ' [ease-in week]' : ''}:`);
    for (const e of w.exercises) { const ex = exById(e.exercise_id); ln(`    ${ex.name}: ${e.sets.map(s => setStr(s, ex) + (s.pr ? ' PR' : '')).join(', ')}${e.feel ? ` [felt ${e.feel}]` : ''}`); }
    if (w.note) ln(`    Note: ${w.note}`);
  }
  for (const c of cardio) ln(`- ${dn(c.date)} ${cardioName(c.type)} ${c.minutes} min${c.incline ? `, ${c.incline}% incline` : ''}${c.speed ? `, ${c.speed} km/h` : ''}`);
  const prs = lifts.flatMap(w => w.exercises.flatMap(e => e.sets.filter(s => s.pr).map(s => `${exById(e.exercise_id).name} ${setStr(s, exById(e.exercise_id))}`)));
  if (prs.length) ln(`- PRs: ${prs.join('; ')}`);
  ln('');
  const ms = measList(), mline = m => `${MEAS.filter(([k]) => m[k] != null).map(([k, , s]) => `${s.toLowerCase()} ${m[k]}`).join(', ')}${bfOf(m) ? `; est. body fat ${fmt(bfOf(m), 1)}%` : ''}`;
  ln('MEASUREMENTS (cm)');
  if (!ms.length) ln('- None yet.');
  else {
    const l = ms[ms.length - 1], pv = ms[ms.length - 2], f = ms[0];
    ln(`- Latest ${l.date}: ${mline(l)}`);
    if (pv) ln(`- Previous ${pv.date}: ${mline(pv)}`);
    if (f !== l && f !== pv) ln(`- Baseline ${f.date}: ${mline(f)}`);
  }
  const notes = days.filter(d => daily(d).note).map(d => `${dn(d)}: ${daily(d).note}`);
  if (notes.length) { ln(''); ln('NOTES'); notes.forEach(n => ln(`- ${n}`)); }
  ln('');
  ln('Please review my week: what is working, and what should I change (calories, protein, training, steps, sleep)? Be specific.');
  return L.join('\n');
}

function reasoning(p, w, t) {
  const B = bmr(w, p), T = B * p.activity;
  return `BMR (Mifflin–St Jeor, male)
  = 10×${fmt(w, 1)} + 6.25×${p.height} − 5×${p.age} + 5 ≈ ${fmt(B)} kcal
TDEE ≈ BMR × ${p.activity} (desk job, 3–4 lifts, 8–10k steps)
  ≈ ${fmt(T)} kcal
Target ${fmt(t.kcal)} kcal → deficit ≈ ${fmt(T - t.kcal)} kcal/day
Protein ${t.protein} g = ${fmt(t.protein * 4)} kcal · Fat ${t.fat} g = ${fmt(t.fat * 9)} kcal
Carbs = remainder ≈ ${fmt((t.kcal - t.protein * 4 - t.fat * 9) / 4)} g
(Weight used: ${w === p.start_weight ? 'start weight' : 'current 7-day average'}.)`;
}
