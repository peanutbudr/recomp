      <div class="row mt-s"><div class="g4 grow">${[['sets', 'Sets'], ['rep_min', 'Min'], ['rep_max', 'Max'], ['rest_s', 'Rest s']].map(([k, l]) => `<div class="field" style="margin:0"><label>${l}</label><input class="input num" type="number" inputmode="numeric" value="${e[k] ?? ''}" placeholder="${k === 'rest_s' ? 'auto' : ''}" data-in="tpl-f" data-i="${i}" data-k="${k}" style="padding:0 4px;text-align:center"></div>`).join('')}</div>
      <button class="icon-btn" data-a="tpl-row" data-i="${i}" data-op="up" ${i === 0 ? 'disabled' : ''} aria-label="Move up">↑</button><button class="icon-btn" data-a="tpl-row" data-i="${i}" data-op="down" ${i === TPL.exercises.length - 1 ? 'disabled' : ''} aria-label="Move down">↓</button></div></div>`).join('')}
    <button class="btn block mt" data-a="tpl-row" data-op="add">+ Add exercise</button>
    <div class="${TPL.isNew ? '' : 'g2'} mt">${TPL.isNew ? '' : '<button class="btn danger" data-a="tpl-del">Delete</button>'}<button class="btn primary ${TPL.isNew ? 'block' : ''}" data-a="tpl-save">Save template</button></div>`, { keep: true });
}
IN['tpl-name'] = el => { TPL.name = el.value; };
C['tpl-rot'] = el => { TPL.in_rotation = el.checked; };
C['tpl-ex'] = el => { TPL.exercises[+el.dataset.i].exercise_id = el.value; };
IN['tpl-f'] = el => { const v = num(el.value); TPL.exercises[+el.dataset.i][el.dataset.k] = el.dataset.k === 'rest_s' ? (v || null) : v; };
A['tpl-row'] = ({ i, op }) => {
  const a = TPL.exercises, k = +i;
  if (op === 'add') a.push({ exercise_id: 'bench' in S.exercises ? 'bench' : Object.keys(S.exercises)[0], sets: 3, rep_min: 8, rep_max: 12, rest_s: null });
  if (op === 'del') a.splice(k, 1);
  if (op === 'up' && k > 0) [a[k - 1], a[k]] = [a[k], a[k - 1]];
  if (op === 'down' && k < a.length - 1) [a[k + 1], a[k]] = [a[k], a[k + 1]];
  tplSheet();
};
A['tpl-save'] = async () => {
  if (!String(TPL.name).trim()) { toast('Name is required'); return; }
  for (const e of TPL.exercises) { e.sets = clamp(Math.round(e.sets || 3), 1, 10); e.rep_min = Math.max(1, Math.round(e.rep_min || 8)); e.rep_max = Math.max(e.rep_min, Math.round(e.rep_max || e.rep_min)); }
  const t = { ...TPL, name: TPL.name.trim() }; delete t.isNew;
  await save('templates', t); closeSheet(); toast(`Saved ${t.name}`); rerender();
};
A['tpl-del'] = async () => { const t = await remove('templates', TPL.id); closeSheet(); rerender(); toast(`Deleted ${t.name}`, { undo: () => save('templates', t) }); };
A['tpl-move'] = async ({ id, d }) => {
  const list = Object.values(S.templates).sort((a, b) => a.order - b.order), i = list.findIndex(t => t.id === id), j = i + +d;
  if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]]; list.forEach((t, k) => { t.order = k + 1; });
  await saveMany('templates', list); rerender();
};

// ---- Exercise library ----
A.exlib = () => openSheet(`<h3>Exercise library</h3><input class="input mt-s" type="search" placeholder="Search" data-in="exlib-q" autocomplete="off"><div class="list mt-s" id="exlibList">${exlibList('')}</div><button class="btn primary block mt" data-a="ex-edit" data-id="">+ New exercise</button>`);
const exlibList = q => Object.values(S.exercises).filter(x => !q || x.name.toLowerCase().includes(q.toLowerCase())).sort((a, b) => a.name.localeCompare(b.name))
  .map(x => `<button class="li" data-a="ex-edit" data-id="${x.id}"><div class="grow"><span class="ellip">${esc(x.name)}</span><span class="tiny muted ellip">${(x.primary || []).join(', ')} · ${x.type} · ${x.equipment} · +${x.increment_kg} kg</span></div><span class="faint">›</span></button>`).join('');
IN['exlib-q'] = el => { $('#exlibList').innerHTML = exlibList(el.value); };
let EXE = null;
A['ex-edit'] = ({ id }) => { EXE = id ? clone(S.exercises[id]) : { id: 'ex_' + uid(), name: '', primary: [], secondary: [], type: 'accessory', equipment: 'machine', increment_kg: 2.5, timed: false, isNew: true }; exSheet(); };
function exSheet() {
  const chips = k => MUSCLES.map(m => `<button class="chip ${EXE[k].includes(m) ? 'on' : ''}" data-a="exe-m" data-k="${k}" data-v="${m}">${m}</button>`).join('');
  openSheet(`<h3>${EXE.isNew ? 'New exercise' : 'Edit exercise'}</h3>
    <div class="field mt"><label>Name</label><input class="input" value="${esc(EXE.name)}" data-in="exe-name"></div>
    <div class="lbl">Primary muscles</div><div class="chips wrap mt-s">${chips('primary')}</div>
    <div class="lbl mt">Secondary muscles (count as ½ set)</div><div class="chips wrap mt-s">${chips('secondary')}</div>
    <div class="lbl mt">Type</div><div class="seg mt-s">${[['compound', 'Compound'], ['accessory', 'Accessory']].map(([v, l]) => `<button class="${EXE.type === v ? 'on' : ''}" data-a="exe-type" data-v="${v}">${l}</button>`).join('')}</div>
    <div class="g2 mt"><div class="field"><label>Equipment</label><select class="input" data-c="exe-eq">${['barbell', 'dumbbell', 'machine', 'cable', 'bodyweight', 'other'].map(v => `<option ${EXE.equipment === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div><div class="field"><label>Increment (kg)</label><input class="input num" type="number" inputmode="decimal" step="0.25" value="${EXE.increment_kg}" data-in="exe-inc"></div></div>
    <label class="check"><input type="checkbox" data-c="exe-timed" ${EXE.timed ? 'checked' : ''}> Timed (log seconds instead of reps)</label>
    <div class="${EXE.isNew ? '' : 'g2'} mt">${EXE.isNew ? '' : '<button class="btn danger" data-a="exe-del">Delete</button>'}<button class="btn primary ${EXE.isNew ? 'block' : ''}" data-a="exe-save">Save</button></div>`, { keep: true });
}
IN['exe-name'] = el => { EXE.name = el.value; };
IN['exe-inc'] = el => { EXE.increment_kg = num(el.value) ?? 0; };
C['exe-eq'] = el => { EXE.equipment = el.value; };
C['exe-timed'] = el => { EXE.timed = el.checked; };
A['exe-m'] = ({ k, v }) => { const a = EXE[k], i = a.indexOf(v); if (i >= 0) a.splice(i, 1); else a.push(v); exSheet(); };
A['exe-type'] = ({ v }) => { EXE.type = v; exSheet(); };
A['exe-save'] = async () => {
  if (!EXE.name.trim()) { toast('Name is required'); return; }
  const x = { ...EXE, name: EXE.name.trim() }; delete x.isNew;
  await save('exercises', x); toast(`Saved ${x.name}`); A.exlib(); rerender();
};
A['exe-del'] = async () => {
  const used = Object.values(S.templates).some(t => t.exercises.some(e => e.exercise_id === EXE.id)) || Object.values(S.workouts).some(w => w.exercises.some(e => e.exercise_id === EXE.id));
  if (used) { toast('It’s used in a template or your history. Rename it instead.'); return; }
  const x = await remove('exercises', EXE.id); A.exlib(); toast(`Deleted ${x.name}`, { undo: () => save('exercises', x) });
};

// ---- Food library + saved meals ----
A.foodlib = () => openSheet(`<h3>Food library</h3><p class="tiny muted">Per-portion values are estimates. Edit them to match your cook’s recipes.</p><input class="input mt-s" type="search" placeholder="Search" data-in="foodlib-q" autocomplete="off"><div class="list mt-s" id="foodlibList">${foodlibList('')}</div><button class="btn primary block mt" data-a="food-new2">+ New food</button>`);
function foodlibList(q) {
  const n = norm(q);
  return Object.values(S.foods).filter(f => !n || norm(f.name).includes(n) || (f.aliases || []).some(a => a.includes(n))).sort((a, b) => a.name.localeCompare(b.name))
    .map(f => `<button class="li" data-a="food-edit2" data-id="${f.id}"><div class="grow"><span class="ellip">${f.favourite ? '★ ' : ''}${esc(f.name)}</span><span class="tiny muted ellip">${esc(f.portion_label)} · ${fmt(f.kcal)} kcal · P ${fmt(f.protein, 1)} · C ${fmt(f.carbs, 1)} · F ${fmt(f.fat, 1)}</span></div><span class="faint">›</span></button>`).join('');
}
IN['foodlib-q'] = el => { $('#foodlibList').innerHTML = foodlibList(el.value); };
A['food-edit2'] = ({ id }) => foodEditor(S.foods[id], { onSaved: () => { A.foodlib(); rerender(); } });
A['food-new2'] = () => foodEditor(null, { onSaved: () => { A.foodlib(); rerender(); } });
A['sm-del'] = async ({ id }) => { const m = await remove('saved_meals', id); rerender(); toast(`Deleted ${m.name}`, { undo: () => save('saved_meals', m) }); };

// ---- Supplements editor ----
let SUP = null;
A['sup-edit'] = ({ i }) => {
  const idx = +i, list = supps();
  SUP = { i: idx, ...(idx >= 0 ? list[idx] : { id: 's_' + uid(), name: '', dose: '', kind: 'check' }) };
  openSheet(`<h3>${idx >= 0 ? 'Edit supplement' : 'New supplement'}</h3>
    <div class="field mt"><label>Name</label><input id="sup_name" class="input" value="${esc(SUP.name)}"></div>
    <div class="field"><label>Dose / note</label><input id="sup_dose" class="input" value="${esc(SUP.dose || '')}" placeholder="e.g. 5 g, 1 capsule"></div>
    ${SUP.food_id ? `<p class="tiny muted">Linked to “${esc((S.foods[SUP.food_id] || {}).name || SUP.food_id)}”: each one adds its macros to your food totals. Edit the macros in the food library.</p>`
      : `<div class="lbl">Type</div><div class="seg mt-s"><button class="${SUP.kind === 'check' ? 'on' : ''}" data-a="sup-kind" data-v="check">Daily checkbox</button><button class="${SUP.kind === 'count' ? 'on' : ''}" data-a="sup-kind" data-v="count">Counter</button></div>`}
    <div class="${idx >= 0 ? 'g2' : ''} mt">${idx >= 0 ? '<button class="btn danger" data-a="sup-del">Delete</button>' : ''}<button class="btn primary ${idx >= 0 ? '' : 'block'}" data-a="sup-save">Save</button></div>`);
};
A['sup-kind'] = ({ v }) => { SUP.kind = v; $$('[data-a="sup-kind"]').forEach(b => b.classList.toggle('on', b.dataset.v === v)); };
A['sup-save'] = async () => {
  const name = $('#sup_name').value.trim(); if (!name) { toast('Name is required'); return; }
  const list = clone(supps()), o = { id: SUP.id, name, dose: $('#sup_dose').value.trim(), kind: SUP.kind };
  if (SUP.food_id) o.food_id = SUP.food_id;
  if (SUP.i >= 0) list[SUP.i] = o; else list.push(o);
  await setKv('supplements', list); closeSheet(); rerender();
};
A['sup-del'] = async () => { const before = clone(supps()), list = clone(before); list.splice(SUP.i, 1); await setKv('supplements', list); closeSheet(); rerender(); toast('Supplement removed', { undo: () => setKv('supplements', before) }); };

// ---- Export / import / reset ----
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
const dataURLToBlob = async u => (await fetch(u)).blob();
A.export = async () => {
  try {
    const data = {};
    for (const s of Object.keys(STORES)) data[s] = Object.values(S[s]);
    data.photos = await Promise.all(data.photos.map(async p => { const { blob, ...rest } = p; return { ...rest, data_url: blob ? await blobToDataURL(blob) : null }; }));
    const json = JSON.stringify({ app: 'recomp', version: 1, exported_at: new Date().toISOString(), data });
    const name = `recomp-backup-${today()}.json`, file = new File([json], name, { type: 'application/json' });
    let shared = false;
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Recomp backup' }); shared = true; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    if (!shared) { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000); }
    await setKv('last_export', today()); toast('Backup exported'); rerender();
  } catch (e) { console.error(e); toast('Export failed: ' + e.message); }
};
A.import = () => { const i = $('#importFile'); i.value = ''; i.click(); };
async function doImport(file) {
  let obj;
  try { obj = JSON.parse(await file.text()); } catch { toast('That file isn’t valid JSON'); return; }
  if (!obj || obj.app !== 'recomp' || !obj.data) { toast('That isn’t a Recomp backup file'); return; }
  confirmSheet('Replace all data?', `This replaces everything on this phone with the backup from ${obj.exported_at ? new Date(obj.exported_at).toLocaleString() : 'the file'}.`, 'Replace with backup', async () => {
    await clearAll(); photoURLs.forEach(u => URL.revokeObjectURL(u)); photoURLs.clear();
    for (const s of Object.keys(STORES)) {
      let rows = Array.isArray(obj.data[s]) ? obj.data[s] : [];
      if (s === 'photos') rows = await Promise.all(rows.filter(r => r.data_url).map(async r => { const { data_url, ...rest } = r; return { ...rest, blob: await dataURLToBlob(data_url) }; }));
      if (rows.length) await saveMany(s, rows);
    }
    if (!S.kv.profile) await seedAll();
    applyTheme(SET().theme || 'auto'); UI.date = null; toast('Backup restored');
  });
}
A.reset = () => openSheet(`<h3>Reset all data</h3><p class="small mt-s">This deletes every log, photo and custom food on this phone and starts again at Day 1 today. Export a backup first if you might want it.</p><div class="field mt"><label>Type RESET to confirm</label><input id="resetIn" class="input" autocomplete="off" autocapitalize="characters" data-enter="reset-go"></div><button class="btn danger block" data-a="reset-go">Delete everything</button>`);
A['reset-go'] = async () => {
  if ($('#resetIn').value.trim().toUpperCase() !== 'RESET') { toast('Type RESET to confirm'); return; }
  await clearAll(); photoURLs.forEach(u => URL.revokeObjectURL(u)); photoURLs.clear(); Rest.stop();
  await seedAll(); closeSheet(); UI.tab = 'today'; UI.date = null; UI.slot = null; render(); window.scrollTo(0, 0);
  toast('All data reset. Day 1 starts today');
};
A.howto = () => openSheet(`<h3>How to use this daily</h3><ol class="small mt" style="padding-left:20px;line-height:1.65;margin:12px 0 0">
  <li><b>Morning:</b> weigh in after the bathroom, tick creatine, and add yesterday’s steps from the Health app.</li>
  <li><b>Meals:</b> on Eat, tap a one-tap button (yesterday’s lunch, saved meals) or type “2 roti, dal, sabzi, curd” and confirm.</li>
  <li><b>Gym:</b> Today → Start. Tick each set (confirm or nudge the pre-filled numbers). The rest timer starts itself. Follow the ↑ hints.</li>
  <li><b>Evening:</b> close the protein gap using the hint on Eat, then log water and sleep.</li>
  <li><b>Sunday:</b> check-in (tape and photos), export a backup, and paste the weekly summary into Claude for a review.</li></ol>`);

/* =========================================================================
   11. BOOT
   ========================================================================= */
const DEV = new URLSearchParams(location.search).has('dev');

// Dev-only: realistic fake history for testing charts (Settings → Dev, needs ?dev=1)
A['dev-seed'] = async () => {
  const days = 24, start = addDays(today(), -(days - 1));
  await setKv('profile', { ...P(), start_date: start });
  for (const t of Object.values(S.targets)) { t.effective_date = start; await save('targets', t); }
  const F = id => S.foods[id], rnd = (a, b) => a + Math.random() * (b - a), rot = rotation();
  const START_W = { bench: 50, row: 45, db_ohp: 14, pulldown: 45, lat_raise: 7, pushdown: 20, db_curl: 10, squat: 60, rdl: 60, leg_press: 100, leg_curl: 30, calf_stand: 40, incline_db: 18, pullup: 0, cable_row: 45, machine_ohp: 30, face_pull: 15, hammer: 10, oh_ext: 15, deadlift: 80, bss: 10, leg_ext: 35, hip_thrust: 60, calf_seat: 30, hkr: 0, plank: 0 };
  let wt = 71.4, ri = 0;
  for (let i = 0; i < days; i++) {
    const d = addDays(start, i);
    wt -= 0.055;
    await save('daily', { date: d, weight: Math.random() < 0.85 ? round(wt + rnd(-0.4, 0.4), 1) : undefined, steps: Math.round(rnd(6000, 11500)), sleep_h: round(rnd(6, 8.5) * 2) / 2, water_ml: 250 * Math.round(rnd(8, 13)), energy: Math.round(rnd(2, 5)),
      supplements: { creatine: Math.random() < 0.9, omega3: Math.random() < 0.8, magnesium: Math.random() < 0.7, whey: Math.random() < 0.6 ? 2 : 1 } });
    const meal = (slot, list) => save('meals', { id: uid(), date: d, slot, items: list.map(([id, q]) => itemFromFood(F(id), q)) });
    await meal('Breakfast', Math.random() < 0.6 ? [['egg', 3], ['egg_white', 2], ['roti', 1]] : [['poha', 1], ['curd', 1]]);
    await meal('Lunch', [['roti', 2], ['dal', 1], ['sabzi_dry', 1], ['curd', 1], ['salad', 1]]);
    await meal('Snacks', Math.random() < 0.5 ? [['chai', 1], ['chana_roasted', 1]] : [['chai_ns', 1]]);
    await meal('Dinner', [[Math.random() < 0.5 ? 'soya_sabzi' : 'paneer_bhurji', 1], ['roti', 2], ['sabzi_gravy', 1]]);
    if (i % 2 === 0 && i < days - 1) {
      const t = rot[ri++ % rot.length], wid = uid(), ease = i < 14;
      const exs = t.exercises.map(e => {
        const se = buildSessionExercise(e, ease, wid);
        se.sets.forEach(s => { if (s.weight === '' || s.weight == null) s.weight = START_W[e.exercise_id] ?? 10; s.reps = clamp(Math.round((+s.reps || e.rep_min) + (Math.random() < 0.6 ? 1 : 0)), e.rep_min, e.rep_max); s.done = true; });
        return se;
      });
      const ts = parseD(d).getTime() + 18 * 3600e3;
      await save('workouts', { id: wid, date: d, template_id: t.id, name: t.name, status: 'done', started_at: ts, finished_at: ts + 65 * 60e3, duration_min: 65, ease, exercises: exs, cardio: Math.random() < 0.5 ? [{ type: 'incline', minutes: 20, incline: 8, speed: 5, kcal_est: cardioKcal({ type: 'incline', minutes: 20, incline: 8, speed: 5 }) }] : [], note: '' });
    } else if (i % 3 === 1) {
      const ts = parseD(d).getTime() + 7 * 3600e3;
      await save('workouts', { id: uid(), date: d, template_id: null, name: 'Cardio', status: 'done', started_at: ts, finished_at: ts, duration_min: 25, exercises: [], cardio: [{ type: 'cycle', minutes: 25, kcal_est: cardioKcal({ type: 'cycle', minutes: 25 }) }], note: '' });
    }
    if (i % 7 === 0) await save('measurements', { date: d, waist: round(92 - i * 0.07 + rnd(-0.3, 0.3), 1), neck: 37.5, chest: 98, arm: round(32 + i * 0.01, 1), hips: 99, thigh: 56 });
  }
  toast('Fake data seeded'); UI.tab = 'today'; render();
};

async function boot() {
  applyTheme(lsGet('theme', 'auto'));
  try { await DB.open(); await loadAll(); } catch (e) { console.error('Storage unavailable', e); DB.db = null; }
  if (!S.kv.profile) await seedAll();
  applyTheme(SET().theme || 'auto');
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
  const r = lsGet('rest');
  if (r && r.end > Date.now()) { Rest.end = r.end; Rest.total = r.total; Rest.run(); }
  render();
  $('#importFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) doImport(f); });
  $('#photoFile').addEventListener('change', onPhoto);
  document.addEventListener('visibilitychange', () => { if (document.hidden) return; if (Rest.end) Rest.tick(); if (!sheetOpen() && !document.activeElement.matches('input,textarea,select')) rerender(); });
  window.addEventListener('load', () => { if (UI.tab === 'progress') rerender(); });
  const mq = matchMedia('(prefers-color-scheme: dark)');
  if (mq.addEventListener) mq.addEventListener('change', () => { if (UI.tab === 'progress') rerender(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e));
}
boot();
</script>
</body>
